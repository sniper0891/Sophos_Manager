name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          json=$(for f in SophosManager*.zip; do
            [ -f "$f" ] || continue
            v=$(echo "$f" | sed -nE 's/.*\.(V[0-9]+)\.zip/\1/p')
            [ -z "$v" ] && v=V1
            echo "{\"zip\":\"$f\",\"version\":\"$v\"}"
          done | paste -sd, -)
          echo "Versions trouvées : $json"
          echo "matrix={\"include\":[$json]}" >> $GITHUB_OUTPUT

  build:
    needs: list
    runs-on: ubuntu-latest
    name: build (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf SophosManager && unzip -o -q "${{ matrix.zip }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: SophosManager
        run: chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sophos-manager-${{ matrix.version }}
          path: SophosManager/app/build/outputs/apk/release/*.apk
