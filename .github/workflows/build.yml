name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dézipper la dernière version
        run: |
          ZIP=$(ls SophosManager.V*.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP" ]; then echo "Aucun fichier SophosManager.V*.zip trouvé"; exit 1; fi
          echo "Zip utilisé : $ZIP"
          rm -rf SophosManager
          unzip -o -q "$ZIP"
          VERSION=$(echo "$ZIP" | sed -E 's/.*\.(V[0-9]+)\.zip/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version : $VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: SophosManager
        run: chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sophos-manager-${{ env.VERSION }}
          path: SophosManager/app/build/outputs/apk/release/*.apk
